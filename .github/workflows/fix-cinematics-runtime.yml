name: Fix cinematics runtime

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-cinematics-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch game runtime
        run: python3 tools/fix_runtime.py

      - name: Commit fix
        run: |
          git config user.name 'Delta Force 0 Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix video overlay and progression launch'
          git push
