name: Import Delta Force 0 package

on:
  push:
    branches: [ main ]
    paths:
      - 'delta-force-0-webapp-pwa-COMPLETE.zip.part-*'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and extract package
        run: |
          COUNT=$(find . -maxdepth 1 -type f -name 'delta-force-0-webapp-pwa-COMPLETE.zip.part-*' | wc -l)
          if [ "$COUNT" -lt 5 ]; then
            echo "Waiting for all 5 package parts (found $COUNT)."
            exit 0
          fi
          cat delta-force-0-webapp-pwa-COMPLETE.zip.part-* > /tmp/delta-force-0-webapp-pwa-COMPLETE.zip
          rm -rf /tmp/df0-import
          mkdir -p /tmp/df0-import
          unzip -q /tmp/delta-force-0-webapp-pwa-COMPLETE.zip -d /tmp/df0-import
          if [ -d /tmp/df0-import/delta-force-0-webapp ]; then
            rsync -a /tmp/df0-import/delta-force-0-webapp/ ./
          else
            rsync -a /tmp/df0-import/ ./
          fi
          rm -f delta-force-0-webapp-pwa-COMPLETE.zip.part-*

      - name: Commit extracted web app
        run: |
          git config user.name 'Delta Force 0 Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Import complete Delta Force 0 Web/PWA build'
          git push
